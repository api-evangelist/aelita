name: Aelita Software
description: >-
  Aelita Software Corporation was an enterprise systems-management software
  company founded in 1998 by Ratmir Timashev (who later co-founded Veeam
  Software). Headquartered in the Columbus, Ohio area (Dublin/Powell, OH),
  Aelita built Windows infrastructure management tooling for Microsoft Active
  Directory and Microsoft Exchange environments — including migration,
  directory management, auditing, reporting, security analysis, systems
  monitoring, and disaster recovery. Marquee products included Migration
  Manager for Active Directory, Migration Manager for Exchange, Secure Copy,
  Enterprise Reporter, Recovery Manager for Active Directory, ActiveRoles
  Server, and InTrust. Insight Partners was an early investor. Aelita was
  acquired by Quest Software in March 2004 for approximately $115 million and
  its technology was folded into Quest's Windows Management line (much of which
  is now part of One Identity). The company has had no independent operation
  since 2004; it exposed no public developer API, developer portal, or
  documentation surface, and there is no live web presence today (the aelita.com
  domain is parked/for sale). This profile is retained as a historical Insight
  Partners portfolio record — there is no active developer surface to enrich.
